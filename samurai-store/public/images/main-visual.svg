<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title">
  <title id="title">SAMURAI Store main visual</title>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
  <circle cx="1030" cy="90" r="180" fill="#ffffff" opacity=".08"/>
  <circle cx="160" cy="430" r="240" fill="#ffffff" opacity=".06"/>
</svg>
